<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Project: Event invite</title>
        <style>
            #invite-img{
                float: right;
                border: 3px solid black;
                background-color: rgb(188, 103, 245);
            }
            #details{
                width: 20%;
                border: 3px dotted darkgray;
                background-color: rgb(255, 186, 255);
                padding: 1px;
                margin-left: 2px;
                font-family: sans-serif;
                font-weight: bold;
            }
            #heading{
                background-color: rgb(227, 168, 227);
                width: 20%;
                margin-left: 2px;
                text-align: center;
            }
            h1{
                font-family: fantasy;
                font-style: italic;
                color: rgb(91, 79, 181);
            }
            h2{
                font-style: oblique;
                color: rgb(99, 60, 150);
            }
            .question{
                color: red;
                font-style: italic;
            }
            .answer{
                color: green;
                font-style: italic;
            }
            body{
                background-color: rgb(242, 67, 140);
            }
        </style>
    </head>
    <body>
        <img id="invite-img" src="https://cdn.kastatic.org/third_party/javascript-khansrc/live-editor/build/images/seasonal/hopper-partying.png">
        <div id="heading">
        <h1>You're invited!</h1>
        <h2>Start of semester party!</h2>
        </div>
        <div id="details">
        <p>The details:</p>
        <ul>
            <li><span class="question">When</span>? - 19:00 <span class="answer">Today</span>.</li>
            <li><span class="question">Where</span>? - At <span class="answer">my house</span>.</li>
            <li><span class="question">What</span> to bring? - Any <span class="answer">food</span>!</li>
        </ul>
        </div>
    </body>
</html>
